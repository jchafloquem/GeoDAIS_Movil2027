spring.application.name=GeoDAISMovil
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
spring.datasource.url=jdbc:postgresql://192.168.1.237:5432/geodais
spring.datasource.username=app_geodais
spring.datasource.password=desarrollo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

geodais.photos.directory=${GEODAIS_PHOTO_DIRECTORY:/opt/JBOSSDATA/GEODAIS}
geodais.photos.public-base-url=${GEODAS_PHOTO_PUBLIC_BASE_URL:}
geodais.photos.allowed-hosts=${GEODAIS_PHOTO_ALLOWED_HOSTS:}
geodais.photos.max-bytes=${GEODAIS_PHOTO_MAX_BYTES:10485760}
geodais.photos.connect-timeout-seconds=${GEODAIS_PHOTO_CONNECT_TIMEOUT_SECONDS:5}
geodais.photos.request-timeout-seconds=${GEODAIS_PHOTO_REQUEST_TIMEOUT_SECONDS:20}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
