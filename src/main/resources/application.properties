spring.application.name=GeoDAISMovil
server.port=${PORT:8080}
server.address=0.0.0.0
#DESARROLLO
#server.servlet.context-path=/
# QA
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/geodais-movile}

# Base de datos (lee variables de entorno o usa valores locales por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.1.237:5432/geodais}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_geodais}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:desarrollo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Gestión de fotografías
geodais.photos.directory=${GEODAIS_PHOTO_DIRECTORY:/opt/JBOSSDATA/GEODAIS}
# DESARROLLO
#geodais.photos.public-base-url=${GEODAIS_PHOTO_PUBLIC_BASE_URL:http://localhost:8080}
# QA
geodais.photos.public-base-url=${GEODAIS_PHOTO_PUBLIC_BASE_URL:https://sisqa.devida.gob.pe/geodais-movile}
geodais.photos.allowed-hosts=${GEODAIS_PHOTO_ALLOWED_HOSTS:}
geodais.photos.max-bytes=${GEODAIS_PHOTO_MAX_BYTES:10485760}
geodais.photos.connect-timeout-seconds=${GEODAIS_PHOTO_CONNECT_TIMEOUT_SECONDS:5}
geodais.photos.request-timeout-seconds=${GEODAIS_PHOTO_REQUEST_TIMEOUT_SECONDS:20}

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs